; GameMode config. Everything not listed here uses the package defaults.
; tuned owns power state; these hooks flip the tuned profile while any game runs
; (see ~/.local/bin/gamemode-hook for why GameMode's own governor switching is not used).

[general]
; split_lock_mitigate is already 0 via sysctl on these machines; GameMode's own attempt is denied by polkit and only logs errors.
disable_splitlock=0

[custom]
start=$HOME/.local/bin/gamemode-hook start
end=$HOME/.local/bin/gamemode-hook end
script_timeout=15
