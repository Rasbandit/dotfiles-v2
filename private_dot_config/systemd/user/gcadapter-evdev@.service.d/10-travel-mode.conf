# Drop-in: keep a unit from (re)starting while travel-mode is in runner mode, e.g. when
# GNOME restarts the session and graphical-session.target pulls these units back.
# Install per unit: ~/.config/systemd/user/<unit>.d/10-travel-mode.conf, then daemon-reload.
# Units: evmapy.service, gcadapter-evdev@.service, steam-gamemode-watch.service
[Service]
ExecCondition=/bin/sh -c '[ "$(cat /var/lib/travel-mode/mode 2>/dev/null)" != runner ]'
