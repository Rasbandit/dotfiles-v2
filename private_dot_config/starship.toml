format = """
[ $os](bg:4 fg:0)\
$time\
[](bg:12 fg:4)\
$directory\
[](fg:12 bg:13)\
$git_branch\
$git_status\
[](fg:13 bg:2)\
$nodejs\
$rust\
$golang\
$php\
$python\
[](fg:2 bg:14)\
${custom.ssh}\
${custom.tailscale}\
${custom.wireguard}\
${custom.protonvpn}\
$docker_context\
[](fg:14)\
$cmd_duration\
\n$character"""

[character]
success_symbol = '[❯](2)'
error_symbol = '[❯](9)'

[directory]
style = "fg:0 bg:12"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"~" = "󰋜"
"Documents" = "󰈙"
"Downloads" = ""
"Music" = ""
"Pictures" = ""

[cmd_duration]
min_time = 2000
format = ' [$duration](3 bold)'

[os]
format = "[[$symbol](bg:4 fg:0)]($style)"
style = "bg:4"
disabled = false

[os.symbols]
AlmaLinux = " "
Alpine = " "
Amazon = " "
Android = " "
Arch = "󰣇 "
Artix = "󰣇 "
CentOS = " "
Debian = " "
DragonFly = " "
EndeavourOS = " "
Fedora = ""
FreeBSD = " "
Garuda = " "
Gentoo = "󰣨 "
Illumos = " "
Kali = " "
Linux = " "
Macos = " "
Manjaro = " "
Mint = "󰣭 "
NixOS = "󱄅 "
OpenBSD = " "
openEuler = "󰏒 "
openSUSE = " "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
RockyLinux = " "
Solus = " "
SUSE = " "
Ubuntu = " "
Unknown = " "
Void = "  "
Windows = " "

[git_branch]
symbol = ""
style = "bg:13"
format = '[[ $symbol $branch ](fg:0 bg:13)]($style)'

[git_status]
style = "bg:13"
format = '[[($all_status$ahead_behind )](fg:0 bg:13)]($style)'

[nodejs]
symbol = ""
format = '[[ $symbol ($version)](fg:0 bg:2)]($style)'

[bun]
symbol = "🍞"
style = "bg:2"
format = '[[ $symbol ($version)](fg:0 bg:2)]($style)'

[rust]
symbol = ""
style = "bg:2"
format = '[[ $symbol ($version)](fg:0 bg:2)]($style)'

[golang]
symbol = ""
style = "bg:2"
format = '[[ $symbol ($version)](fg:0 bg:2)]($style)'

[php]
symbol = ""
style = "bg:2"
format = '[[ $symbol ($version)](fg:0 bg:2)]($style)'

[python]
symbol = ""
style = "bg:2"
format = '[[ $symbol ($version)(\($virtualenv\))](fg:0 bg:2)]($style)'

[custom.ssh]
symbol = "󰢹"
description = "Connected via SSH"
command = "hostname -s"
format = "[[ $symbol $output ](fg:0 bg:14)]($style)"
style = "fg:0 bg:14"
when = '[ -n "$SSH_CLIENT" ] || [ -n "$SSH_TTY" ]'

[custom.tailscale]
symbol = "󰈺"
command = "tailscale status 2>/dev/null | awk '/exit node/{print $2; exit}'"
format = "[[ $symbol $output ](fg:0 bg:14)]($style)"
style = "(fg:0 bg:6)"
when = "tailscale status 2>/dev/null | grep -q 'exit node'"

[custom.wireguard]
symbol = " "
command = "wg show interfaces"
format = "[[ $symbol $output ](fg:0 bg:14)]($style)"
style = "(fg:0 bg:14)"
when = "wg show interfaces | grep -v proton0 | grep -q ."

[custom.protonvpn]
symbol = "󰦝"
command = """python3 -c "
import json, os
conn_file = os.path.expanduser('~/.cache/Proton/VPN/connection/connection_persistence.json')
srv_file = os.path.expanduser('~/.cache/Proton/VPN/serverlist.json')
with open(conn_file) as f: conn = json.load(f)
with open(srv_file) as f: sl = json.load(f)
servers = {s['Name']: s for s in sl.get('LogicalServers', [])}
sv = servers.get(conn['server']['server_name'], {})
city = sv.get('City', '')
country = sv.get('ExitCountry', '')
print(city if city else country)
" 2>/dev/null"""
format = "[[ $symbol $output ](fg:0 bg:14)]($style)"
style = "(fg:0 bg:14)"
when = "test -f ~/.cache/Proton/VPN/connection/connection_persistence.json"

[time]
disabled = false
time_format = "%H:%M"
style = "bg:4"
format = '[ $time ](fg:0 bg:4)'

[docker_context]
symbol = " "
style = "bg:14"
format = '[[ $symbol $context ](fg:0 bg:14)]($style)'
only_with_files = false
