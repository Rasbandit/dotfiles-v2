---
# darkman - automatic dark/light mode switching based on sunrise/sunset

- name: Install darkman and geoclue2
  ansible.builtin.dnf:
    name:
      - darkman
      - geoclue2
    state: present
  become: true
  when: os_distribution == 'fedora'

- name: Ensure dark-mode.d directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/share/dark-mode.d"
    state: directory
    mode: '0755'
  become: false

- name: Ensure light-mode.d directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/share/light-mode.d"
    state: directory
    mode: '0755'
  become: false

- name: Create dark mode transition script
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/.local/share/dark-mode.d/00-gnome-color-scheme.sh"
    mode: '0755'
    content: |
      #!/bin/sh
      gsettings set org.gnome.desktop.interface color-scheme prefer-dark
  become: false

- name: Create light mode transition script
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/.local/share/light-mode.d/00-gnome-color-scheme.sh"
    mode: '0755'
    content: |
      #!/bin/sh
      gsettings set org.gnome.desktop.interface color-scheme prefer-light
  become: false

- name: Reload systemd user daemon
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: false

- name: Enable and start darkman service
  ansible.builtin.systemd:
    name: darkman
    enabled: true
    state: started
    scope: user
  become: false
