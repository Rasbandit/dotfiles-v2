---
# Custom GNOME keybindings

- name: Set custom keybindings
  ansible.builtin.shell: |
    # Function to add/update custom keybinding
    add_keybinding() {
        local NAME="$1"
        local COMMAND="$2"
        local BINDING="$3"
        local INDEX="$4"

        local PATH="/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom${INDEX}/"
        local SCHEMA="org.gnome.settings-daemon.plugins.media-keys.custom-keybinding:${PATH}"

        gsettings set "${SCHEMA}" name "${NAME}"
        gsettings set "${SCHEMA}" command "${COMMAND}"
        gsettings set "${SCHEMA}" binding "${BINDING}"
    }

    # Define all keybindings
    add_keybinding "1pass Quick" "1password --quick-access" "<Control><Shift>space" 0
    add_keybinding "1pass" "1password" "<Control><Shift>backslash" 1
    add_keybinding "Ghostty" "{{ lookup('env', 'HOME') }}/.local/bin/focus-or-run.sh 'com.mitchellh.ghostty' 'ghostty'" "<Control><Shift><Alt>t" 2
    add_keybinding "Vivaldi" "{{ lookup('env', 'HOME') }}/.local/bin/focus-or-run.sh 'vivaldi-stable' 'vivaldi'" "<Control><Shift><Alt>v" 3
    add_keybinding "VS Code" "{{ lookup('env', 'HOME') }}/.local/bin/focus-or-run.sh 'code' 'code'" "<Control><Shift><Alt>c" 4
    add_keybinding "Obsidian" "{{ lookup('env', 'HOME') }}/.local/bin/focus-or-run.sh 'md.obsidian.Obsidian' 'flatpak run md.obsidian.Obsidian'" "<Control><Shift><Alt>q" 5
    add_keybinding "Discord" "{{ lookup('env', 'HOME') }}/.local/bin/focus-or-run.sh 'discord' 'flatpak run com.discordapp.Discord'" "<Control><Shift><Alt>d" 6
    add_keybinding "Spotify" "{{ lookup('env', 'HOME') }}/.local/bin/focus-or-run.sh 'spotify' 'flatpak run com.spotify.Client'" "<Control><Shift><Alt>m" 7
    add_keybinding "Slack" "{{ lookup('env', 'HOME') }}/.local/bin/focus-or-run.sh 'slack' 'flatpak run com.slack.Slack'" "<Control><Shift><Alt>s" 8
    add_keybinding "1pass App" "1password" "<Control><Shift><Alt>1" 9

    # Register all keybindings
    gsettings set org.gnome.settings-daemon.plugins.media-keys custom-keybindings "['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom3/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom4/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom5/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom6/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom7/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom8/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom9/']"

    # Clear GNOME WM bindings that conflict with CapsLock-held (Ctrl+Shift+Alt) combos
    gsettings set org.gnome.desktop.wm.keybindings cycle-panels-backward "['']"
    gsettings set org.gnome.desktop.wm.keybindings move-to-workspace-up "['']"
    gsettings set org.gnome.desktop.wm.keybindings switch-panels-backward "['']"

    # Clear IBus hotkeys that conflict with CapsLock-held (Alt+Shift fires next-engine)
    gsettings set org.freedesktop.ibus.general.hotkey next-engine "[]"
    gsettings set org.freedesktop.ibus.general.hotkey next-engine-in-menu "[]"
  args:
    executable: /bin/bash
  become: false
  changed_when: false
