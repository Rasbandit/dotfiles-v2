---
# Gaming (desktop): Steam, Lutris, evmapy, controller drivers
# TODO: ES-DE frontend
# TODO: NFS game library mounts (home network only — configure on desktop directly)

# --- Games ---

- name: Install Steam and Lutris (Fedora)
  ansible.builtin.dnf:
    name:
      - steam
      - lutris
    state: present
  become: true
  when: os_distribution == 'fedora'

- name: Install Steam and Lutris (Debian)
  ansible.builtin.apt:
    name:
      - steam
      - lutris
    state: present
  become: true
  when: os_family == 'debian'

# --- evmapy (evdev event mapper) ---
# Maps controller button combos to keyboard shortcuts / commands.
# Installed from fork: https://github.com/Rasbandit/evmapy-updated

- name: Install python3-evdev dependency (Fedora)
  ansible.builtin.dnf:
    name: python3-evdev
    state: present
  become: true
  when: os_distribution == 'fedora'

- name: Install python3-evdev dependency (Debian)
  ansible.builtin.apt:
    name: python3-evdev
    state: present
  become: true
  when: os_family == 'debian'

- name: Install evmapy from GitHub fork
  ansible.builtin.pip:
    name: git+https://github.com/Rasbandit/evmapy-updated.git
    extra_args: --user
  become: false

- name: Add user to input group (evmapy needs /dev/input access)
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: input
    append: true
  become: true

# --- Controller drivers (Fedora only) ---
# Two controllers:
#   1. Xbox Wireless Controller via official Xbox Wireless Adapter (045e:02e6) → xone driver
#   2. Flydigi VADER4 via proprietary 2.4GHz dongle (emulates 045e:028e Xbox 360) → xpad module
#
# xone is an out-of-tree kernel module that needs akmod + Secure Boot MOK signing.
# xpad is in-tree but xone blocklists it — needs modules-load.d + modprobe override.
#
# MANUAL STEP REQUIRED after first run on a new machine:
#   Reboot → MOK Manager appears → "Enroll MOK" → "Continue" → type "akmods" → "Reboot"
#   This is one-time. After enrollment, akmod modules auto-sign on kernel updates.

- name: Auto-load xpad kernel module (Flydigi VADER4 Xbox 360 emulation)
  ansible.builtin.copy:
    content: "xpad\n"
    dest: /etc/modules-load.d/xpad.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Override xone blocklist so xpad can coexist (VADER4 needs xpad)
  ansible.builtin.copy:
    content: |
      # Allow xpad alongside xone (VADER4 2.4GHz dongle presents as Xbox360 controller)
      # xone blocklists xpad in /usr/lib/modprobe.d/60-xone.conf — this overrides it.
      # No conflict: xone claims 045e:02e6 (Xbox Wireless Adapter), xpad claims 045e:028e (Xbox 360).
      install xpad /sbin/modprobe --ignore-install xpad
    dest: /etc/modprobe.d/99-xpad-unblock.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Add xone COPR repository
  community.general.copr:
    name: sentry/xone
    state: enabled
  become: true
  ignore_errors: true
  when: os_distribution == 'fedora'

- name: Install xone driver and akmods signing infrastructure
  ansible.builtin.dnf:
    name:
      - akmods
      - akmod-xone
      - xone-firmware
      - lpf-xone-firmware
    state: present
  become: true
  when: os_distribution == 'fedora'

- name: Check if akmods MOK key is already enrolled
  ansible.builtin.command: mokutil --test-key /etc/pki/akmods/certs/public_key.der
  register: mok_test
  changed_when: false
  failed_when: false
  become: true
  when: os_distribution == 'fedora'

- name: Import akmods MOK key for Secure Boot (password is "akmods")
  ansible.builtin.shell: echo -e "akmods\nakmods" | mokutil --import /etc/pki/akmods/certs/public_key.der
  become: true
  when:
    - os_distribution == 'fedora'
    - mok_test.rc != 0
  register: mok_import

- name: Remind user about MOK enrollment
  ansible.builtin.debug:
    msg: >-
      REBOOT REQUIRED: At the blue MOK Manager screen →
      "Enroll MOK" → "Continue" → type "akmods" → "Reboot".
      One-time only — all future kernel updates auto-sign.
  when:
    - mok_import is defined
    - mok_import is changed

# --- Sleep On LAN (SOL) ---
# Remote power off and navigation control (for TV remote via Sunshine/Moonlight).
# Listens on UDP:9000, UDP:7000, HTTP:8009.
# Uses ydotool for Wayland-compatible input simulation.
# Project: https://github.com/SR-G/sleep-on-lan

- name: Install ydotool (Wayland input simulation for SOL)
  ansible.builtin.dnf:
    name: ydotool
    state: present
  become: true
  when: os_distribution == 'fedora'

- name: Create ydotool service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/ydotool.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Configure ydotool socket permissions (input group access)
  ansible.builtin.copy:
    src: ydotool-override.conf
    dest: /etc/systemd/system/ydotool.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart ydotool

- name: Enable ydotool service
  ansible.builtin.systemd:
    name: ydotool
    enabled: true
    daemon_reload: true
  become: true

- name: Download Sleep On LAN binary
  ansible.builtin.unarchive:
    src: https://github.com/SR-G/sleep-on-lan/releases/download/1.1.1-RELEASE/SleepOnLAN-1.1.1-RELEASE.zip
    dest: /tmp
    remote_src: true
    creates: /tmp/linux_amd64/sol
  become: false

- name: Install SOL binary to /usr/local/bin (SELinux requires bin_t context)
  ansible.builtin.copy:
    src: /tmp/linux_amd64/sol
    dest: /usr/local/bin/sol
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  become: true

- name: Create SOL config directory
  ansible.builtin.file:
    path: /etc/sol
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install SOL configuration
  ansible.builtin.template:
    src: sol.json.j2
    dest: /etc/sol/sol.json
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart sol

- name: Install SOL systemd service
  ansible.builtin.copy:
    src: sol.service
    dest: /etc/systemd/system/sol.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart sol

- name: Enable SOL service
  ansible.builtin.systemd:
    name: sol
    enabled: true
    daemon_reload: true
  become: true

# --- Xbox Wireless Adapter reliability ---
# Four-layer fix for boot reliability and radio lockup recovery.
# See docs/controllers.md for full explanation.

- name: Include xone dongle firmware in initramfs (fixes boot unplug/replug)
  ansible.builtin.copy:
    content: |
      # Include xone dongle firmware in initramfs so it is available
      # when the xone_dongle module loads during early boot.
      install_items+=" /usr/lib/firmware/xone_dongle_02e6.bin /usr/lib/firmware/xone_dongle_02f9.bin /usr/lib/firmware/xone_dongle_02fe.bin /usr/lib/firmware/xone_dongle_091e.bin "
    dest: /etc/dracut.conf.d/xone.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: rebuild initramfs

- name: Blacklist xone from udev autoload (delayed load avoids 36s of USB errors)
  ansible.builtin.copy:
    content: |
      # Prevent udev from auto-loading xone at USB detection time.
      # A systemd service (xone-delayed-load.service) loads these after
      # a short delay so the USB bus is fully stable.
      blacklist xone_dongle
      blacklist xone_gip
      blacklist xone_gip_gamepad
    dest: /etc/modprobe.d/xone-delayed.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Install xone delayed-load systemd service
  ansible.builtin.copy:
    src: xone-delayed-load.service
    dest: /etc/systemd/system/xone-delayed-load.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: reload systemd

- name: Install xone watchdog script
  ansible.builtin.copy:
    src: xone-watchdog.sh
    dest: /usr/local/bin/xone-watchdog.sh
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install xone watchdog systemd service
  ansible.builtin.copy:
    src: xone-watchdog.service
    dest: /etc/systemd/system/xone-watchdog.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: reload systemd

- name: Enable xone-delayed-load and xone-watchdog services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  become: true
  loop:
    - xone-delayed-load.service
    - xone-watchdog.service

# --- GameCube Adapter ---
# gcadapter_oc: 1000Hz USB polling via DKMS kernel module.
# gcadapter-evdev: exposes each port as a virtual evdev gamepad.
# NOTE: The multi-adapter patch for gcadapter_oc must be applied manually after install.
#       See docs/gc-adapter.md — "Multi-adapter patch" section.
# NOTE: gcadapter_evdev binary must be compiled manually from files/gcadapter-evdev/.
#       See docs/gc-adapter.md — "Rebuilding from Source" section.

- name: Enable gcadapter_oc COPR repository (1000Hz polling)
  community.general.copr:
    name: kylegospo/gcadapter_oc-dkms
    state: enabled
  become: true
  when: os_distribution == 'fedora'

- name: Install gcadapter_oc DKMS module
  ansible.builtin.dnf:
    name: gcadapter_oc-dkms
    state: present
  become: true
  when: os_distribution == 'fedora'

- name: Auto-load gcadapter_oc at boot
  ansible.builtin.copy:
    content: "gcadapter_oc\n"
    dest: /etc/modules-load.d/gcadapter-oc.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Install build dependencies for gcadapter-evdev
  ansible.builtin.dnf:
    name:
      - gcc
      - libusb1-devel
    state: present
  become: true
  when: os_distribution == 'fedora'

- name: Build gcadapter-evdev binary
  ansible.builtin.shell:
    cmd: make
    chdir: "{{ lookup('env', 'HOME') }}/Documents/claude-home/files/gcadapter-evdev"
    creates: "{{ lookup('env', 'HOME') }}/Documents/claude-home/files/gcadapter-evdev/bin/gcadapter_evdev"
  become: false

- name: Install gcadapter-evdev binary to /usr/local/bin
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/Documents/claude-home/files/gcadapter-evdev/bin/gcadapter_evdev"
    dest: /usr/local/bin/gcadapter_evdev
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  become: true

- name: Install usbmon udev rule (gcadapter-nav passive sniffer for Dolphin native mode)
  ansible.builtin.copy:
    content: 'SUBSYSTEM=="usbmon", GROUP="input", MODE="0640"'
    dest: /etc/udev/rules.d/73-usbmon.rules
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: reload udev

- name: Auto-load usbmon at boot (gcadapter-nav passive sniffer)
  ansible.builtin.copy:
    content: "usbmon\n"
    dest: /etc/modules-load.d/usbmon.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Install gcadapter udev rule (USB access permission for 057e:0337)
  ansible.builtin.copy:
    content: 'SUBSYSTEM=="usb", ENV{DEVTYPE}=="usb_device", ATTRS{idVendor}=="057e", ATTRS{idProduct}=="0337", TAG+="uaccess"'
    dest: /etc/udev/rules.d/71-gcadapter.rules
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: reload udev

- name: Install gcadapter hotplug udev rule
  ansible.builtin.copy:
    src: 73-gcadapter-hotplug.rules
    dest: /etc/udev/rules.d/73-gcadapter-hotplug.rules
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: reload udev

- name: Install gcadapter hotplug systemd service (templated with username)
  ansible.builtin.template:
    src: gcadapter-hotplug.service.j2
    dest: /etc/systemd/system/gcadapter-hotplug.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: reload systemd

# --- Gaming performance tuning ---

- name: Install sysctl gaming tuning
  ansible.builtin.copy:
    content: |
      # Gaming perf tuning
      kernel.split_lock_mitigate = 0
      kernel.sched_autogroup_enabled = 0
      vm.dirty_ratio = 20
      vm.dirty_background_ratio = 5
    dest: /etc/sysctl.d/90-gaming.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: reload sysctl

- name: Disable unnecessary services (not needed on a gaming desktop)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  become: true
  failed_when: false
  loop:
    - iscsi-onboot
    - iscsi-starter
    - mdmonitor
    - qemu-guest-agent
    - ModemManager
    - sssd

- name: Enable gamemoded user service
  ansible.builtin.systemd:
    name: gamemoded
    enabled: true
    scope: user
  become: false

- name: Enable esde-chmod-watcher path unit (auto-fix AppImage/script execute bits)
  ansible.builtin.systemd:
    name: esde-chmod-watcher.path
    enabled: true
    scope: user
  become: false

# --- ES-DE Media Audit ---
# Hourly + on-boot cron to download missing media, upgrade low-quality covers,
# and fill metadata gaps. Script portion is free (Steam/SGDB APIs); AI portion
# (Claude CLI) is gated to run once per 7 days. Cache prevents repeat lookups.
# Script + cron wrapper live in ~/Documents/claude-home (separate git repo).

- name: Install ES-DE media script Python dependencies
  ansible.builtin.pip:
    name:
      - requests
      - Pillow
    extra_args: --user
  become: false

- name: Set up ES-DE hourly media audit cron
  ansible.builtin.cron:
    name: "ES-DE media audit"
    minute: "23"
    job: "{{ lookup('env', 'HOME') }}/Documents/claude-home/scripts/esde-audit-cron.sh"
    state: present

- name: Set up ES-DE media audit on boot (5 min delay for network)
  ansible.builtin.cron:
    name: "ES-DE media audit on boot"
    special_time: reboot
    job: "sleep 300 && {{ lookup('env', 'HOME') }}/Documents/claude-home/scripts/esde-audit-cron.sh"
    state: present
