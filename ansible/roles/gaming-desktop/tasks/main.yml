---
# Gaming (desktop): Steam, Lutris, evmapy, controller drivers
# TODO: ES-DE frontend
# TODO: NFS game library mounts (home network only — configure on desktop directly)

# --- Games ---

- name: Install Steam and Lutris (Fedora)
  ansible.builtin.dnf:
    name:
      - steam
      - lutris
    state: present
  become: true
  when: os_distribution == 'fedora'

- name: Install Steam and Lutris (Debian)
  ansible.builtin.apt:
    name:
      - steam
      - lutris
    state: present
  become: true
  when: os_family == 'debian'

# --- evmapy (evdev event mapper) ---
# Maps controller button combos to keyboard shortcuts / commands.
# Installed from fork: https://github.com/Rasbandit/evmapy-updated

- name: Install python3-evdev dependency (Fedora)
  ansible.builtin.dnf:
    name: python3-evdev
    state: present
  become: true
  when: os_distribution == 'fedora'

- name: Install python3-evdev dependency (Debian)
  ansible.builtin.apt:
    name: python3-evdev
    state: present
  become: true
  when: os_family == 'debian'

- name: Install evmapy from GitHub fork
  ansible.builtin.pip:
    name: git+https://github.com/Rasbandit/evmapy-updated.git
    extra_args: --user
  become: false

- name: Add user to input group (evmapy needs /dev/input access)
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: input
    append: true
  become: true

# --- Controller drivers (Fedora only) ---
# Two controllers:
#   1. Xbox Wireless Controller via official Xbox Wireless Adapter (045e:02e6) → xone driver
#   2. Flydigi VADER4 via proprietary 2.4GHz dongle (emulates 045e:028e Xbox 360) → xpad module
#
# xone is an out-of-tree kernel module that needs akmod + Secure Boot MOK signing.
# xpad is in-tree but xone blocklists it — needs modules-load.d + modprobe override.
#
# MANUAL STEP REQUIRED after first run on a new machine:
#   Reboot → MOK Manager appears → "Enroll MOK" → "Continue" → type "akmods" → "Reboot"
#   This is one-time. After enrollment, akmod modules auto-sign on kernel updates.

- name: Auto-load xpad kernel module (Flydigi VADER4 Xbox 360 emulation)
  ansible.builtin.copy:
    content: "xpad\n"
    dest: /etc/modules-load.d/xpad.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Override xone blocklist so xpad can coexist (VADER4 needs xpad)
  ansible.builtin.copy:
    content: |
      # Allow xpad alongside xone (VADER4 2.4GHz dongle presents as Xbox360 controller)
      # xone blocklists xpad in /usr/lib/modprobe.d/60-xone.conf — this overrides it.
      # No conflict: xone claims 045e:02e6 (Xbox Wireless Adapter), xpad claims 045e:028e (Xbox 360).
      install xpad /sbin/modprobe --ignore-install xpad
    dest: /etc/modprobe.d/99-xpad-unblock.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Add xone COPR repository
  community.general.copr:
    name: sentry/xone
    state: enabled
  become: true
  ignore_errors: true
  when: os_distribution == 'fedora'

- name: Install xone driver and akmods signing infrastructure
  ansible.builtin.dnf:
    name:
      - akmods
      - akmod-xone
      - xone-firmware
      - lpf-xone-firmware
    state: present
  become: true
  when: os_distribution == 'fedora'

- name: Check if akmods MOK key is already enrolled
  ansible.builtin.command: mokutil --test-key /etc/pki/akmods/certs/public_key.der
  register: mok_test
  changed_when: false
  failed_when: false
  become: true
  when: os_distribution == 'fedora'

- name: Import akmods MOK key for Secure Boot (password is "akmods")
  ansible.builtin.shell: echo -e "akmods\nakmods" | mokutil --import /etc/pki/akmods/certs/public_key.der
  become: true
  when:
    - os_distribution == 'fedora'
    - mok_test.rc != 0
  register: mok_import

- name: Remind user about MOK enrollment
  ansible.builtin.debug:
    msg: >-
      REBOOT REQUIRED: At the blue MOK Manager screen →
      "Enroll MOK" → "Continue" → type "akmods" → "Reboot".
      One-time only — all future kernel updates auto-sign.
  when:
    - mok_import is defined
    - mok_import is changed
