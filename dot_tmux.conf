# Prefix key
set -g prefix C-Space
unbind C-b
# Press prefix twice: jump to last window
bind C-Space last-window

# Splits open in the current pane's directory
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Mouse support (click panes, drag borders to resize, scroll)
set -g mouse on

# No-prefix session switching
bind -n M-Right switch-client -n
bind -n M-Left switch-client -p
bind -n M-H switch-client -p
bind -n M-L switch-client -n
bind -n M-K previous-window
bind -n M-J next-window

# No-prefix pane movement (vim keys)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-z resize-pane -Z

# Jump to the next Claude that needs you (yellow first, then green)
bind -n M-n run-shell '~/.local/bin/tmux-claude-next'

# No-prefix window switching
bind -n S-Left previous-window
bind -n S-Right next-window

# Resize panes: prefix + H/J/K/L, repeatable
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Rename session
bind r command-prompt -I "#S" { rename-session "%%" }

# Reload config
bind R source-file ~/.tmux.conf \; display "config reloaded"

# Number windows/panes from 1, close gaps
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Name windows after their session (prefix , still renames manually).
# ponytail: hooks, because automatic-rename-format can't see the session name
set-hook -g after-new-session 'rename-window "#{session_name}"'
set-hook -g after-new-window 'rename-window "#{session_name}"'
set-hook -g session-renamed "run -b \"tmux list-windows -t '#{session_id}' -F '##{window_id}' | xargs -I{} tmux rename-window -t {} #{q:session_name}\""

# Let apps (Claude Code) query the real terminal background over SSH
set -g allow-passthrough on
set -as terminal-features ",*:RGB"

# Copy-mode selections go to the outer terminal clipboard (OSC 52), works over SSH
set -s set-clipboard on
set -as terminal-features ",*:clipboard"
# Status bar — two rows
set -g status-position bottom
set -g status 2
set -g status-interval 2

# ── Colors: terminal palette indices (auto-follows theme) ──
# colour0=black  colour4=blue  colour7=white  colour8=bright-black (gray)

# ── Bottom row: sessions (yellow bg = Claude blocked on you, green = Claude finished) ──
set -g status-style 'bg=colour8,fg=colour0'
set -g status-left-length 120
set -g status-left '#{S:#{?#{==:#{session_name},#{client_session}},#[bg=colour4 fg=colour0 bold] #{session_name} ,#{?#{W:#{P:#{?#{==:#{@claude_state},input},1,}}},#[bg=colour3 fg=colour0 bold],#{?#{W:#{P:#{?#{==:#{@claude_state},done},1,}}},#[bg=colour8 fg=colour2 bold],#[bg=colour8 fg=colour7]}} #{session_name} }#[default]}'
set -g status-right '#[fg=colour0] #H '
set -g status-right-length 20
bind -n MouseDown1StatusLeft choose-tree -s

set -g status-format[1] '#[align=left range=left]#{T:status-left}#[norange default]#[align=right]#{T:status-right}'

# Green (finished) clears once you visit or leave that pane; yellow stays until handled
set-hook -g pane-focus-in 'if -F "#{==:#{@claude_state},done}" "set -pu @claude_state"'
set-hook -g pane-focus-out 'if -F "#{==:#{@claude_state},done}" "set -pu @claude_state"'

# Pane labels: Claude panes show their session title, others the program.
# Labels shrink only when the whole row would overflow the terminal.
# ponytail: room ignores other windows' tabs; count them if you run many windows
set -g @pane_label '#{?#{==:#{pane_current_command},claude},#{s/^[^ ]+ //:pane_title},#{pane_current_command}}'
set -g @pane_room '#{e|-:#{e|-:#{client_width},#{e|+:#{n:window_name},4}},#{e|*:#{window_panes},5}}'
set -g @pane_text '#{?#{e|<=:#{n:#{P:#{E:@pane_label}}},#{E:@pane_room}},#{E:@pane_label},#{=/#{e|/:#{E:@pane_room},#{window_panes}}/…:#{E:@pane_label}}}'

# ── Top row: windows; the current window also lists its panes ──
set -g status-format[0] '#[align=left bg=colour8 fg=colour0]#[list=on align=left]#{W:#[range=window|#{window_index} bg=colour8 fg=colour7] #I:#W #[norange default],#[range=window|#{window_index} list=focus bg=colour4 fg=colour0 bold] #I:#W #[norange default]#{P:#[bg=colour8 fg=colour0]│#{?#{==:#{@claude_state},input},#[bg=colour3 fg=colour0 bold],#{?#{==:#{@claude_state},done},#[bg=colour8 fg=colour2 bold],#[bg=colour8 fg=colour7]}} #P:#{E:@pane_text} ,#[bg=colour8 fg=colour0]│#[bg=colour7 fg=colour0 bold] #P:#{E:@pane_text} }#[default]}'

# Hide default window list from row 1 (sessions only)
set -g window-status-format ''
set -g window-status-current-format ''

# Popup shell over everything (type exit to close)
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# Sensible settings
set -sg escape-time 0
set -g history-limit 50000
set -g focus-events on

# ── Plugins (TPM). prefix I = install, prefix U = update ──
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Bootstrap on a fresh machine: clone TPM, load it, then install plugins
if "test ! -d ~/.tmux/plugins/tpm" "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"
run '~/.tmux/plugins/tpm/tpm'
if "test ! -d ~/.tmux/plugins/tmux-resurrect" "run -b '~/.tmux/plugins/tpm/bin/install_plugins'"
