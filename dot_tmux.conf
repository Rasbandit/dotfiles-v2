# Prefix key
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Splits open in the current pane's directory
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Mouse support (click panes, drag borders to resize, scroll)
set -g mouse on

# No-prefix session switching
bind -n M-Right switch-client -n
bind -n M-Left switch-client -p

# Let apps (Claude Code) query the real terminal background over SSH
set -g allow-passthrough on
set -as terminal-features ",*:RGB"
