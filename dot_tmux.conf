# Prefix key
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Intuitive split bindings
bind \\ split-window -h
bind - split-window -v
unbind '"'
unbind %

# Mouse support
set -g mouse on

# Let apps (Claude Code) query the real terminal background over SSH
set -g allow-passthrough on
set -as terminal-features ",*:RGB"
