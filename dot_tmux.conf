# Prefix key
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Intuitive split bindings
bind \\ split-window -h
bind - split-window -v
unbind '"'
unbind %

# Mouse support
set -g mouse on

# Let apps (Claude Code) query the real terminal background over SSH
set -g allow-passthrough on
set -as terminal-features ",*:RGB"

# ── Session-centric workflow (amux) ──────────────────────
# Swap sessions like you'd swap windows
bind c new-session
bind n switch-client -n
bind p switch-client -p
bind x confirm-before -p "kill session? (y/n)" "run-shell 'tmux switch-client -n; tmux kill-session -t \"#{session_name}\"'"
bind r command-prompt -I "#S" "rename-session '%%'"

# No-prefix session switching (fast!)
bind -n M-Right switch-client -n
bind -n M-Left switch-client -p

# Jump to session by index (0-9)
bind 0 switch-client -t 0
bind 1 switch-client -t 1
bind 2 switch-client -t 2
bind 3 switch-client -t 3
bind 4 switch-client -t 4
bind 5 switch-client -t 5
bind 6 switch-client -t 6
bind 7 switch-client -t 7
bind 8 switch-client -t 8
bind 9 switch-client -t 9

# Status bar — two rows
set -g status-position bottom
set -g status 2
set -g status-interval 2

# ── Colors: terminal palette indices (auto-follows theme) ──
# colour0=black  colour4=blue  colour7=white  colour8=bright-black (gray)

# ── Row 1 (bottom): sessions ──
set -g status-style 'bg=colour8,fg=colour0'
set -g status-left-length 120
set -g status-left '#{S:#{?#{==:#{session_name},#{client_session}},#[bg=colour4 fg=colour0 bold] #{session_name} ,#[bg=colour8 fg=colour7] #{session_name} }#[default]}'
set -g status-right '#[fg=colour0] #H '
set -g status-right-length 20
bind -n MouseDown1StatusLeft choose-tree -s

# ── Row 2 (top of bar): windows within current session ──
set -g status-format[1] '#[align=left bg=colour8 fg=colour0]#[list=on align=left]#{W:#[range=window|#{window_index} bg=colour8 fg=colour7] #I:#W #[norange default],#[range=window|#{window_index} list=focus bg=colour4 fg=colour0 bold] #I:#W #[norange default]}'

# Hide default window list from row 1 (sessions only)
set -g window-status-format ''
set -g window-status-current-format ''
